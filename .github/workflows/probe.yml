# One-off data probes. Runs only on pushes to probe/** branches; never touches main or the site.
name: probe
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Backfill xG
        run: python -m research.xg_backfill $(cat research/xg_backfill_args.txt)
      - name: Save backfill to this branch
        if: always()
        run: |
          git config user.name "oracle-fc-bot"
          git config user.email "oracle-fc-bot@users.noreply.github.com"
          git add data/context/fotmob_extra_*.parquet || true
          git diff --cached --quiet || (git commit -m "probe: xG backfill" && git push)
      - run: python -m oraclefc.cli ingest
      - name: Test xG in these leagues
        run: python -m research.xg_extra_backtest
      - name: Save test summary
        if: always()
        run: |
          git add experiments/backtests/xg_extra_summary.json || true
          git diff --cached --quiet || (git commit -m "probe: xG test summary" && git pull --rebase && git push)
