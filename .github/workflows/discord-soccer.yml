name: Discord /soccer
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Slate date YYYY-MM-DD (America/New_York)'
        required: true
      relay:
        description: 'AES-GCM encrypted interaction credentials'
        required: true
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATE: ${{ inputs.date }}
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decrypt interaction
        env:
          RELAY_PAYLOAD: ${{ inputs.relay }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: node scripts/discord-relay.mjs decrypt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Refresh permitted results
        run: python -m oraclefc.cli ingest
      - name: Refresh match context
        run: python -m oraclefc.cli ingest-context
      - name: Run model and freeze before prices
        run: python -m oraclefc.cli run --date "$DATE" --days 1 --refresh
      - name: Compare prices after freeze
        continue-on-error: true
        run: python -m oraclefc.cli edge --date "$DATE" --days 1
      - name: Build Discord response from this run
        run: node scripts/discord-report.mjs
      - name: Deliver result
        run: node scripts/discord-relay.mjs post
      - name: Report failure
        if: failure() && env.INTERACTION_TOKEN != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/discord-relay.mjs fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-model-${{ github.run_id }}
          path: |
            out/
            data/dates/
            data/edge/
            docs/data/
            market_snapshots/
            data/forecasts/
          retention-days: 14
