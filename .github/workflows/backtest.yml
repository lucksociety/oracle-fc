name: backtest
# Weekly walk-forward re-validation; champion/challenger decision is recorded in experiments/.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      skip_tune:
        description: "Skip hyper-parameter search"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m oraclefc.cli ingest
      - run: python -m oraclefc.cli backtest ${{ github.event.inputs.skip_tune == 'true' && '--skip-tune' || '' }}
      - run: |
          git config user.name "oracle-fc-bot"
          git config user.email "oracle-fc-bot@users.noreply.github.com"
          git add docs/BACKTEST.md experiments/
          git diff --cached --quiet || (git commit -m "backtest: weekly walk-forward $(date -u +%F)" && git pull --rebase && git push)
